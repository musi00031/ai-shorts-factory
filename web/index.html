<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Shorts Factory</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#f5f7fa;font:16px system-ui}main{max-width:850px;margin:auto;padding:24px}.box{background:#151b26;border:1px solid #2b3545;border-radius:16px;padding:20px;margin:16px 0}input,textarea,select{width:100%;padding:12px;margin:6px 0 14px;background:#0b111b;color:white;border:1px solid #354052;border-radius:9px}textarea{min-height:110px}button{padding:12px 18px;background:#ed4055;color:white;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.job{border-top:1px solid #344052;padding:14px 0}.muted{color:#9ba7b8;font-size:13px}a{color:#ff8998}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{font-weight:600}
</style></head><body><main>
<h1>🎬 AI Shorts Factory</h1><p class="muted">Локальная фабрика вертикальных видео 9:16</p>
<section class="box"><h2>Подключение</h2><label>API_KEY из серверного .env</label><input id="key" type="password" autocomplete="off" placeholder="Ключ доступа"><button onclick="connect()">Подключить</button><span id="conn" class="muted"></span></section>
<section class="box"><h2>Новый ролик</h2><label>Тема</label><input id="topic" placeholder="5 необычных фактов о космосе"><label>Свой сценарий (необязательно)</label><textarea id="script"></textarea><label>Язык</label><select id="lang"><option value="ru">Русский</option><option value="en">English</option></select><label>Длительность, секунд</label><input id="dur" type="number" min="10" max="90" value="35"><button onclick="createJob()">Создать видео</button><p id="msg" class="muted"></p></section>
<section class="box"><div class="row"><h2>Задачи</h2><button onclick="load()">Обновить</button></div><div id="jobs" class="muted">Введи API-ключ и нажми «Подключить».</div></section>
</main><script>
const el=id=>document.getElementById(id);let connected=false;
function headers(){return {'Authorization':'Bearer '+el('key').value.trim()};}
async function connect(){if(!el('key').value.trim()){el('conn').textContent=' Введи ключ';return;}try{const r=await fetch('/api/jobs?limit=1',{headers:headers()});if(!r.ok)throw new Error((await r.json()).detail||r.status);connected=true;el('conn').textContent=' Подключено';load();}catch(e){connected=false;el('conn').textContent=' Ошибка: '+e.message;}}
async function createJob(){if(!connected){el('msg').textContent='Сначала подключи API-ключ';return;}const topic=el('topic').value.trim();if(topic.length<2){el('msg').textContent='Введи тему';return;}try{const r=await fetch('/api/jobs',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({topic,script:el('script').value,language:el('lang').value,duration:Number(el('dur').value)})});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);el('msg').textContent='Задача создана: '+d.id;load();}catch(e){el('msg').textContent='Ошибка: '+e.message;}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function download(id){try{const r=await fetch('/api/jobs/'+encodeURIComponent(id)+'/video',{headers:headers()});if(!r.ok)throw new Error((await r.json()).detail||r.status);const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='short-'+id+'.mp4';a.click();URL.revokeObjectURL(url);}catch(e){el('msg').textContent='Ошибка скачивания: '+e.message;}}
async function load(){if(!connected)return;try{const r=await fetch('/api/jobs',{headers:headers()});if(!r.ok)throw new Error(r.status);const d=await r.json();el('jobs').innerHTML=d.jobs.map(j=>'<div class="job"><b>'+esc(j.topic)+'</b><div class="status">'+esc(j.status)+'</div><div class="muted">'+esc(j.id)+'</div>'+(j.status==='completed'?'<button onclick="download(\''+esc(j.id)+'\')">Скачать MP4</button>':'')+(j.error?'<div>'+esc(j.error)+'</div>':'')+'</div>').join('')||'Пока нет задач';}catch(e){el('jobs').textContent='Ошибка: '+e.message;}}
setInterval(load,5000);
</script></body></html>
