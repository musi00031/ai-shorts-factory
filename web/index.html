<!doctype html><html lang='ru'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AI Shorts Factory</title><style>body{margin:0;background:#0b0e14;color:#f5f7fa;font:16px system-ui}main{max-width:850px;margin:auto;padding:24px}.box{background:#151b26;border:1px solid #2b3545;border-radius:16px;padding:20px;margin:16px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;background:#0b111b;color:white;border:1px solid #354052;border-radius:9px}textarea{min-height:100px}button{padding:12px 18px;background:#ed4055;color:white;border:0;border-radius:9px;font-weight:bold}.job{border-top:1px solid #344052;padding:12px 0}.muted{color:#9ba7b8;font-size:13px}a{color:#ff8998}</style><main><h1>🎬 AI Shorts Factory</h1><p class='muted'>Создание вертикальных видео из темы или сценария</p><section class='box'><h2>Новый ролик</h2><label>API key (тот, что указан в .env на сервере)</label><input id='key' type='password' autocomplete='off' placeholder='Вставь API_KEY; остаётся только в этой вкладке'><label>Тема</label><input id='topic' placeholder='5 необычных фактов о космосе'><label>Сценарий (необязательно)</label><textarea id='script'></textarea><label>Язык</label><select id='lang'><option value='ru'>Русский</option><option value='en'>English</option></select><label>Длительность, сек.</label><input id='dur' type='number' min='10' max='90' value='35'><button onclick='createJob()'>Создать видео</button><p id='msg' class='muted'></p></section><section class='box'><h2>Задачи</h2><div id='jobs'>Загрузка…</div></section></main><script>const el=id=>document.getElementById(id);async function createJob(){let topic=el('topic').value.trim();if(topic.length<2){el('msg').textContent='Введи тему';return}let headers={'Content-Type':'application/json'};if(el('key').value)headers.Authorization='Bearer '+el('key').value;let r=await fetch('/api/jobs',{method:'POST',headers,body:JSON.stringify({topic,script:el('script').value,language:el('lang').value,duration:Number(el('dur').value)})});let d=await r.json();el('msg').textContent=r.ok?'Создано: '+d.id:JSON.stringify(d);load()}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}async function load(){let d=await(await fetch('/api/jobs')).json();el('jobs').innerHTML=d.jobs.map(j=>'<div class=\"job\"><b>'+esc(j.topic)+'</b><div>'+esc(j.status)+'</div><div class=\"muted\">'+esc(j.id)+'</div>'+(j.status==='completed'?'<a href=\"/api/jobs/'+j.id+'/video\">Скачать MP4</a>':'')+(j.error?'<div>'+esc(j.error)+'</div>':'')+'</div>').join('')||'Нет задач'}load();setInterval(load,4000)</script></html>
