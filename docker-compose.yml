services:
  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["factory_data:/data"]
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    command: ["python","-m","app.telegram_bot"]
    environment:
      FACTORY_URL: http://app:8000
    depends_on: [app]
    profiles: ["telegram"]
    restart: unless-stopped
volumes:
  factory_data:
